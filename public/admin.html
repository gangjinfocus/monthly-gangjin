<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>월간 강진 · 편집실</title><link rel="stylesheet" href="__BASE_PATH__/admin.css"><script defer src="__BASE_PATH__/admin.js"></script></head>
<body data-api-base="__BASE_PATH__/api"><header><a href="__BASE_PATH__/">월간 강진</a><span>편집실</span><button id="logout" hidden>로그아웃</button></header>
<main><div id="notice" role="status" aria-live="polite"></div><section id="login"><h1>관리자 로그인</h1><p>서버에서 등록한 관리자 계정으로 로그인하세요.</p><form id="login-form"><label>이메일<input name="email" type="email" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form><p class="muted">최초 계정은 서버의 init-admin 명령으로 등록합니다.</p></section>
<section id="workspace" hidden><nav aria-label="편집 메뉴"><button data-tab="articles" aria-pressed="true">기사</button><button data-tab="issues">발행호</button><button data-tab="settings">홈 · 사이트 설정</button><button data-tab="inquiries">문의</button><button data-tab="exports">내보내기</button></nav><div id="panel"></div></section></main>
<dialog id="editor"><form id="editor-form"><div class="dialog-head"><h2 id="editor-title">기사 편집</h2><button type="button" id="editor-close" aria-label="닫기">닫기</button></div><div id="editor-fields"></div><div class="dialog-foot"><button type="submit">저장</button><span>저장한 공개 기사는 즉시 사이트에 반영됩니다.</span></div></form></dialog>
</body></html>
